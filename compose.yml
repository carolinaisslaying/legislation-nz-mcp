    #         LEGISLATION_NZ_RSS_API_KEY: ${LEGISLATION_NZ_RSS_API_KEY_2:-}
    #         LEGISLATION_PUBLIC_URL: ${LEGISLATION_PUBLIC_URL_2:?set LEGISLATION_PUBLIC_URL_2 in .env}
    #         LEGISLATION_AUTH_USERS: ${LEGISLATION_AUTH_USERS_2:-}
    #         LEGISLATION_DAILY_CAP_PER_USER: ${LEGISLATION_DAILY_CAP_PER_USER_2:-4000}
    #         LEGISLATION_AUTH_REDIRECT_ALLOWLIST: ${LEGISLATION_AUTH_REDIRECT_ALLOWLIST_2:-}
